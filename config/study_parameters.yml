study:
  site: "University of Minnesota Horticultural Research Center"
  acquisition_date: "2025-08-11"
  right_camera_id: "016F4E5D"

camera_mapping:
  forward_offset_cm: -50
  left_offset_cm: 57
  horizontal_fov_deg: 60.5
  max_distance_m: 1.5
  neighbor_threshold_m: 2.0
  edge_extension_m: 1.0
